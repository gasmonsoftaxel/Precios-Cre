name: Descarga diaria de precios

"on":
  workflow_dispatch:
  schedule:
    # Tres intentos al dia. El script es idempotente: el primero que
    # tenga exito escribe el archivo, los demas no hacen nada.
    # Minuto 23 a proposito: GitHub encola las tareas del minuto 0.
    - cron: "23 13 * * *"   # 07:23 CDMX
    - cron: "23 16 * * *"   # 10:23 CDMX
    - cron: "23 19 * * *"   # 13:23 CDMX

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar precios
        run: python descarga.py

      - name: Guardar en el repositorio
        run: |
          git config user.name "bot-precios"
          git config user.email "bot-precios@users.noreply.github.com"
          git add historico catalogo.csv estaciones_geo.csv.gz
          git diff --staged --quiet || git commit -m "Precios $(date -u +%F)"
          git push
