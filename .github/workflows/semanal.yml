name: Actualizacion semanal del KML

"on":
  workflow_dispatch:
  schedule:
    # Lunes 15:40 UTC = 09:40 CDMX. Profeco publica el promedio de la
    # semana anterior, asi que el lunes ya esta el corte nuevo.
    - cron: "40 15 * * 1"

permissions:
  contents: write

jobs:
  kml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # continue-on-error para que, si kml.py aborta por sus guardas, el
      # diagnostico si alcance a subirse al repositorio. El job se marca
      # como fallido al final, en el ultimo paso.
      - name: Descargar y procesar el KML de Profeco
        id: kml
        continue-on-error: true
        run: python kml.py

      - name: Regenerar la geografia con los atributos nuevos
        if: steps.kml.outcome == 'success'
        run: |
          python - <<'PY'
          import csv, geo
          with open("catalogo.csv", encoding="utf-8") as fh:
              geo.construir(list(csv.DictReader(fh)))
          PY

      # "git add -A ." toma lo que cambio, se creo o se borro, sin nombrar
      # archivos uno por uno. Nombrar _kml_diagnostico.txt rompia el job
      # cuando kml.py terminaba bien y lo borraba: git falla con codigo 128
      # si un pathspec no existe.
      - name: Guardar en el repositorio
        run: |
          git config user.name "bot-precios"
          git config user.email "bot-precios@users.noreply.github.com"
          git add -A .
          git status --short
          git diff --staged --quiet || git commit -m "KML semanal $(date -u +%F)"
          git push

      - name: Marcar el job como fallido si el KML no se pudo procesar
        if: steps.kml.outcome != 'success'
        run: |
          echo "kml.py aborto. Los archivos anteriores quedaron intactos."
          echo "Revisa _kml_diagnostico.txt en el repositorio."
          exit 1
